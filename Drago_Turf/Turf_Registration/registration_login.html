
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="Login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet" />
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap');
*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
}
#page-container{
    
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
#login-form-container{
    
    height: 500px;
    width: 700px;
    display: flex;
    box-shadow: 2px 3px 30px gray;
}
#logo-container{
   
    width: 250px;
    display: flex;
    justify-content: center;
    height: 100%;
    align-items: center;
    background-color: #00d9aa;
}
#sub-logo-container{
    
    text-align: center;
    padding-left: 25px;
    padding-right: 25px;
}
#sub-logo-container>img{
    width: 90px;
    margin-bottom: 4px;
}
#sub-logo-container>p{
    
    font-size: 15px;
    /* text-align: justify; */
    }
#black-color-div{
    height: 100vh;
    position: absolute;
    z-index: -1;
    
    width: 43.6%;
    background-color: #00d9aa;
}
#form-con{
    
    width: 450px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

#login-form-con{
  
    width: 350px;
}
#login-form-con>h1{
    text-align: center;
    font-family: 'Roboto Condensed',sans-serif;
    margin-bottom: 25px;
    font-style: italic;
}
#form-group>label{
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}
#form-group>input{
    width: 100%;
    padding: 7px;
}
#form-group{
    margin-bottom:15px;
}
#forgetpasswordtext{
    display: block;
    text-align: right;
}
#login-btn{
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: 0px;
    font-size:15px;
    background-color:#00d9aa ;
    border-radius: 15px;
    transition: .5s;
}
#login-btn:hover{
    box-shadow: 5px 5px 10px gray;
    transition: .5s;
}
#register-form{
  position: absolute;
    left: 130px;
    top: 415px;
}
#register-form-signup{
    text-decoration: none;
    color: #00d9aa;
}
#register-form-signup:hover{
    text-decoration: underline;
    
}
.user-details #form-group input:focus,
.user-details #form-group input:valid {
  /* border-color:#00d9aa; */
  border: 2px solid #00d9aa;
}

.user-details #form-group input {

border: 1px solid gray;
border-bottom-width: 2px;
border-radius: 5px;
outline:none ;
}
</style>
<body>
    <div id="black-color-div"></div>
    <div id="page-container">
        <div id="login-form-container">
            <div id="logo-container">
                <div id="sub-logo-container">
                    <img src="Images\Login_Foot_Ball.png" alt="my company logo">
                    <p>Login With Your Turf Name and Mobile Number</p>
                </div>
            </div>
            <div id="form-con">
                
                <!-- <div id="form-sub-con"> -->
                    <div id="login-form-con">
                        <h1>Login</h1>
                        <form >

                            <div class="user-details">
                               <div id="form-group">
                                <label for="turfname-box" >Turf Name</label>
                                <input type="text" name="turfname" id="turfname-box" placeholder="Enter Your Turf Name" required>
                               </div>
                            </div>

                            <div class="user-details">
                               <div id="form-group">
                                   <label for="tmobile-box">Mobile Number</label>
                                   <input type="text" name="tmobile" id="tmobile-box" placeholder="Enter Your Mobile Number" required>
                               </div>
                            </div>
                       
                        <button id="login-btn">Log in</button>
                        <div id="register-form">Register a New Turf?<a href="registration.html" id="register-form-signup">Register</a> </div>
                    </div>
                </form>
               <!-- </div> -->
            </div>
        </div>
    </div>

</body>
</html>
<script src="registration_login.js"></script>
